services:
  postgres:
    image: postgres:16-alpine
    container_name: music-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-music_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_DATABASE:-music_platform}
    ports:
      # Только localhost: для локальной разработки и pg_dump на сервере, наружу не торчит
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: music-backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./static:/app/static
      - ./uploads:/app/uploads

volumes:
  postgres_data:
